# Full local stack for Prototype Walkthrough.
#   Infra only:   docker compose up -d postgres redis minio
#   Whole stack:  docker compose up --build
#
# The stack runs with the REAL product adapters (Postgres + Redis/BullMQ + S3),
# and the FAKE recorder/AI by default so it works without the engine or a key.
# Set AI_PROVIDER=openai (+ OPENAI_API_KEY) and wire the engine for real output.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ptw
      POSTGRES_PASSWORD: ptw
      POSTGRES_DB: ptw
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptw"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_started } }
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb --ignore-existing local/walkthroughs;
      mc anonymous set none local/walkthroughs;
      echo 'bucket ready'; "

  # One-shot: create the Job table (prisma db push) before web/worker start.
  migrate:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    command: ["npm", "run", "db:push", "-w", "@ptw/core"]
    environment:
      DATABASE_URL: postgresql://ptw:ptw@postgres:5432/ptw
    depends_on: { postgres: { condition: service_healthy } }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["3000:3000"]
    environment: &appenv
      NODE_ENV: production
      APP_MODE: demo
      JOB_STORE: postgres
      QUEUE_DRIVER: redis
      STORAGE_DRIVER: s3
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      EXECUTOR: fake
      DATABASE_URL: postgresql://ptw:ptw@postgres:5432/ptw
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Browser-reachable endpoint for presigned download URLs (minio publishes 9000 to the host).
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: walkthroughs
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-8000}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    environment:
      # Inherit the shared app env, then run the REAL recorder in the worker.
      # (AI stays fake until OPENAI_API_KEY is available — set AI_PROVIDER=openai then.)
      <<: *appenv
      EXECUTOR: local-process
      ENGINE_DIR: /app/packages/recorder-cli
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 1

volumes:
  pg-data:
  minio-data:
