# Local infrastructure for Prototype Walkthrough.
# The vertical slice does NOT require these (it defaults to in-memory adapters);
# bring them up when you switch QUEUE_DRIVER=redis / JOB_STORE=postgres /
# STORAGE_DRIVER=s3, or to exercise the full stack.
#
#   docker compose up -d postgres redis minio
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ptw
      POSTGRES_PASSWORD: ptw
      POSTGRES_DB: ptw
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptw"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the private bucket used for artifacts.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb --ignore-existing local/walkthroughs;
      mc anonymous set none local/walkthroughs;
      echo 'bucket ready';
      "

volumes:
  pg-data:
  minio-data:
