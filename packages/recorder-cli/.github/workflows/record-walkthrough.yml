name: Record walkthrough

# Two ways to produce a WebM:
#   1) Actions tab → "Record walkthrough" → Run workflow (pick a script + optional URL/pace)
#   2) Push a change under scripts/** → each changed script.md is recorded automatically
# The finished .webm files are attached to the run as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Path to the script.md to record"
        required: true
        default: scripts/autodesk-post-purchase-onboarding.md
      url:
        description: "Prototype URL (optional; overrides the script's url:)"
        required: false
        default: ""
      pace:
        description: "Pace multiplier (optional: 0.85 faster / 1.3 slower)"
        required: false
        default: ""
  push:
    paths:
      - "scripts/**"

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Ensure ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ffmpeg; }

      - name: Select scripts to record
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="${{ github.event.inputs.script }}"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            list="$(git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" -- 'scripts/*.md' | tr '\n' ' ')"
          fi
          echo "Scripts to record: [$list]"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Record walkthrough(s)
        env:
          PROTOTYPE_URL: ${{ github.event.inputs.url }}
          PACE: ${{ github.event.inputs.pace }}
        run: |
          set -euo pipefail
          scripts="${{ steps.pick.outputs.list }}"
          if [ -z "${scripts// /}" ]; then
            echo "No changed scripts/*.md to record — nothing to do."
            exit 0
          fi
          for s in $scripts; do
            if [ ! -f "$s" ]; then echo "Skipping missing script: $s"; continue; fi
            echo "::group::Recording $s"
            npm run walkthrough:record -- "$s"
            echo "::endgroup::"
          done

      - name: Upload WebM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-webm
          path: output/*.webm
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
